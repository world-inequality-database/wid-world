name: Export grade definitions

on:
  workflow_dispatch:
    inputs:
      distributed_short:
        description: 'Select which set of definitions you wish to include: Distributed variables — short definitions'
        required: false
        default: false
        type: boolean
      distributed_long:
        description: 'Distributed variables — long definitions'
        required: false
        default: false
        type: boolean
      aggregated_short:
        description: 'Aggregated variables — short definitions'
        required: false
        default: false
        type: boolean
      aggregated_long:
        description: 'Aggregated variables — long definitions'
        required: false
        default: false
        type: boolean
      mode:
        description: 'merge = columns side by side on Grade; separate = one CSV per sheet'
        required: true
        default: merge
        type: choice
        options:
          - merge
          - separate

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Excel reader
        run: python -m pip install 'openpyxl==3.1.5'

      - name: Show available sheets
        run: python data-input/data-quality-definitions/export_grade_definitions.py --list-sheets

      - name: Export selected sheets
        env:
          INCLUDE_DISTRIBUTED_SHORT: ${{ inputs.distributed_short }}
          INCLUDE_DISTRIBUTED_LONG: ${{ inputs.distributed_long }}
          INCLUDE_AGGREGATED_SHORT: ${{ inputs.aggregated_short }}
          INCLUDE_AGGREGATED_LONG: ${{ inputs.aggregated_long }}
          EXPORT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          selected_sheets=()
          if [[ "$INCLUDE_DISTRIBUTED_SHORT" == "true" ]]; then
            selected_sheets+=("Distributed variables (short de")
          fi
          if [[ "$INCLUDE_DISTRIBUTED_LONG" == "true" ]]; then
            selected_sheets+=("Distributed variables (long des")
          fi
          if [[ "$INCLUDE_AGGREGATED_SHORT" == "true" ]]; then
            selected_sheets+=("Aggregated variables (short des")
          fi
          if [[ "$INCLUDE_AGGREGATED_LONG" == "true" ]]; then
            selected_sheets+=("Aggregated variables (long desr")
          fi
          if (( ${#selected_sheets[@]} == 0 )); then
            echo "::error::Select at least one sheet using the checkboxes."
            exit 1
          fi
          EXPORT_SHEETS=$(IFS=,; echo "${selected_sheets[*]}")
          case "$EXPORT_MODE" in
            merge) export_output="grade_exports/grade_definitions.csv" ;;
            separate) export_output="grade_exports" ;;
            *) echo "Unknown export mode" >&2; exit 1 ;;
          esac
          python data-input/data-quality-definitions/export_grade_definitions.py \
            --sheets "$EXPORT_SHEETS" \
            --mode "$EXPORT_MODE" \
            --output "$export_output"

      - name: Upload CSV files
        uses: actions/upload-artifact@v7
        with:
          name: grade-definitions-${{ inputs.mode }}
          path: grade_exports/*.csv
          if-no-files-found: error
          retention-days: 30
