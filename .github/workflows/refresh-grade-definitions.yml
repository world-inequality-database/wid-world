name: Refresh grade definition CSVs

on:
  push:
    branches: [master]
    paths:
      - data-input/data-quality-definitions/grade_definitions.xlsx
      - data-input/data-quality-definitions/export_grade_definitions.py
      - .github/workflows/refresh-grade-definitions.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-grade-definitions
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Excel reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Regenerate and commit CSVs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # If another push arrives during generation, rebuild from its latest Excel.
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python data-input/data-quality-definitions/export_grade_definitions.py --mode batch
            git add -- data-input/data-quality-definitions/csv_outputs/*.csv
            if git diff --cached --quiet; then
              echo 'CSV files are already up to date.'
              exit 0
            fi
            git commit -m 'Update grade definition CSVs'
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          echo '::error::Could not push CSVs. Check branch protection and Actions write permissions, then rerun.'
          exit 1
